[project]
name = "single-object-detection"
version = "0.1.0"
description = "Single-object plate detection YOLOv8n (pt only) + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "python-multipart>=0.0.9",
    "ultralytics>=8.4",
    "torch>=2.0",
    "cloudpickle>=3.0",
    "nvidia-ml-py>=12.0",
    "ultralytics-platform>=0.1",
    "ultralytics-thop>=2.1",
    "opencv-python>=4.10",
    "pillow>=11.3.0",
    "numpy>=2.1.3",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
real-model = ["ultralytics", "torch"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
